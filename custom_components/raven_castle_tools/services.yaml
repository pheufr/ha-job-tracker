trigger_job:
  description: Trigger an RC Job immediately
  fields:
    entity_id:
      description: The RC Jobs entity ID to trigger
      example: "binary_sensor.rc_jobs_trash_day"

complete_job:
  description: Mark an RC Job as completed
  fields:
    entity_id:
      description: The RC Jobs entity ID to complete
      example: "binary_sensor.rc_jobs_trash_day"

add_player:
  description: Add a player to RC Quiz
  fields:
    name:
      description: Player full name
      example: "Alice Smith"
    alias:
      description: Player alias shown on leaderboard
      example: "Ace"
    photo:
      description: Player photo URL or local path
      example: "/local/players/alice.jpg"

remove_player:
  description: Remove a player from RC Quiz permanently
  fields:
    entity_id:
      description: Quiz player sensor entity ID
      example: "sensor.rc_quiz_player1"
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

enable_player:
  description: Enable a player for the current quiz
  fields:
    entity_id:
      description: Quiz player sensor entity ID
      example: "sensor.rc_quiz_player1"
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

disable_player:
  description: Disable a player for the current quiz
  fields:
    entity_id:
      description: Quiz player sensor entity ID
      example: "sensor.rc_quiz_player1"
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

add_points:
  description: Add points to a player's current round score
  fields:
    entity_id:
      description: Quiz player sensor entity ID
      example: "sensor.rc_quiz_player1"
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"
    points:
      description: Number of points to add (can be negative)
      example: 5

remove_points:
  description: Remove points from a player's current round score
  fields:
    entity_id:
      description: Quiz player sensor entity ID
      example: "sensor.rc_quiz_player1"
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"
    points:
      description: Number of points to remove
      example: 5

start_new_round:
  description: Start a new RC Quiz round

start_new_quiz:
  description: Start a new RC Quiz and reset all scores to zero

reset_quiz:
  description: Reset RC Quiz scores and disable all players
