trigger_job:
  description: Trigger a job immediately
  fields:
    entity_id:
      description: The entity ID of the job to trigger
      example: "binary_sensor.job_manager_my_job"

complete_job:
  description: Mark a job as completed
  fields:
    entity_id:
      description: The entity ID of the job to complete
      example: "binary_sensor.job_manager_my_job"
