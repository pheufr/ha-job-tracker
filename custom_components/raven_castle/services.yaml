trigger_job:
  description: Trigger a job immediately (RC Jobs feature)
  fields:
    entity_id:
      description: The entity ID of the job to trigger
      example: "binary_sensor.rc_jobs_abc123"
      required: true
      selector:
        entity:
          domain: binary_sensor

complete_job:
  description: Mark a job as completed (RC Jobs feature)
  fields:
    entity_id:
      description: The entity ID of the job to complete
      example: "binary_sensor.rc_jobs_abc123"
      required: true
      selector:
        entity:
          domain: binary_sensor
